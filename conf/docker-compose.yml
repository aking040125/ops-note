# ==========================================================
# LNMP 容器编排
# 用之前先 cp .env.example .env，然后把 CHANGE_ME 改成自己的
# 启动：docker compose up -d --build
# ==========================================================

services:
  # ---------------- Nginx ----------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: lnmp-nginx:1.0
    container_name: lnmp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      php:
        condition: service_started
    healthcheck:
      # /healthz 是自己在 default.conf 里配的一个空页面，直接 return 200
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - lnmp-net
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- PHP-FPM ----------------
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
      args:
        # 这几个必须在这里传，改了要 --build 才生效（踩过坑，见 03-踩坑笔记 第 7 条）
        PHP_PM_MAX_CHILDREN: ${PHP_PM_MAX_CHILDREN:-12}
        PHP_PM_START_SERVERS: ${PHP_PM_START_SERVERS:-3}
        PHP_PM_MIN_SPARE: ${PHP_PM_MIN_SPARE:-2}
        PHP_PM_MAX_SPARE: ${PHP_PM_MAX_SPARE:-6}
    image: lnmp-php:1.0
    container_name: lnmp-php
    restart: unless-stopped
    volumes:
      - ./php/www:/var/www/html
    depends_on:
      mariadb:
        # 必须等数据库真的能连上，不是等它启动（踩过坑，见 03-踩坑笔记 第 1 条）
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-demo}
      DB_USER: ${DB_USER:-app}
      DB_PASS: ${DB_PASS:-CHANGE_ME}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - lnmp-net
    mem_limit: 320m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- MariaDB ----------------
  mariadb:
    image: mariadb:10.6
    container_name: lnmp-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-128M}
      - --slow-query-log=1
      - --long-query-time=1
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-CHANGE_ME}
      MARIADB_DATABASE: ${DB_NAME:-demo}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASS:-CHANGE_ME}
      TZ: Asia/Shanghai
    volumes:
      - lnmp-db:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 这个很关键：没有它，PHP 会因为数据库还没初始化完就报连接被拒
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASS:-CHANGE_ME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - lnmp-net
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lnmp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  # named volume：docker compose down 不会删，只有 down -v 才删
  lnmp-db:
    name: lnmp-db
