# ==========================================================
# Keepalived 配置 —— web2（备，优先级低）
# 放在 192.168.86.8 的 /etc/keepalived/keepalived.conf
#
# 和 web1 只差三处：router_id、state、priority，
# 还有 unicast 的 src/peer 对调
# ==========================================================

global_defs {
    router_id LVS_WEB2
    # vrrp_strict
}

vrrp_script check_nginx {
    script   "/etc/keepalived/check_nginx.sh"
    interval 0.5
    fall     3
    rise     2
    weight   -30
}

vrrp_instance VI_1 {
    state BACKUP                 # 这边是 BACKUP
    interface ens33
    virtual_router_id 51
    priority 140                 # 比 web1 低 10
    advert_int 0.5

    unicast_src_ip 192.168.86.8  # 对调
    unicast_peer {
        192.168.86.7
    }

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME      # 必须和 web1 一致
    }

    virtual_ipaddress {
        192.168.86.100/24 dev ens33
    }

    notify_master "/etc/keepalived/notify.sh master"
    notify_backup "/etc/keepalived/notify.sh backup"
    notify_fault  "/etc/keepalived/notify.sh fault"
}
