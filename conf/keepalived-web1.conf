# ==========================================================
# Keepalived 配置 —— web1（主，优先级高）
# 放在 192.168.86.7 的 /etc/keepalived/keepalived.conf
# ==========================================================

global_defs {
    router_id LVS_WEB1

    # 注意：这里刻意不开 vrrp_strict。
    # vrrp_strict 是用来拒绝「单播」VRRP 报文做安全加固的，
    # 但下面用的是 unicast_peer 单播，开了会导致两台都收不到包，谁都不接管 VIP。
    # 详细原因见 03-踩坑笔记 第 9 条。
    # vrrp_strict
}

# -------- 探活脚本 --------
# 每 0.5 秒跑一次，检查宿主机 8080 端口的 /healthz
# fall 3 表示连续失败 3 次（1.5 秒）才认定出问题
# 把 fall 设成 1 会误切，详见 03-踩坑笔记 第 3 条
vrrp_script check_nginx {
    script   "/etc/keepalived/check_nginx.sh"
    interval 0.5
    fall     3
    rise     2
    weight   -30
}

# -------- 实例 --------
vrrp_instance VI_1 {
    state MASTER
    interface ens33              # 用 ip a 确认自己的网卡名，CentOS 7 一般是 ens33
    virtual_router_id 51
    priority 150                 # 主：150，备：140
    advert_int 0.5               # 每 0.5 秒通告一次

    # 用单播，不用组播。实验环境的虚拟交换机对组播支持不好
    unicast_src_ip 192.168.86.7
    unicast_peer {
        192.168.86.8
    }

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME      # 两台必须一样，最长 8 位
    }

    virtual_ipaddress {
        192.168.86.100/24 dev ens33
    }

    # 状态变化时记录日志，方便排查
    notify_master "/etc/keepalived/notify.sh master"
    notify_backup "/etc/keepalived/notify.sh backup"
    notify_fault  "/etc/keepalived/notify.sh fault"
}
