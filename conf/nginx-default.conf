# ==========================================================
# Nginx 站点配置
# 位置：nginx/conf.d/default.conf
# ==========================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.php index.html;

    # -------- 健康检查 --------
    # Keepalived 的探活脚本就打这个，故意不查数据库
    # 因为要判断的是「这台机器能不能对外服务」，不是「数据库通不通」
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # -------- 静态文件 --------
    location /static/ {
        expires 1h;
        access_log off;
    }

    # -------- PHP --------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # php-fpm 是 compose 里的服务名，Docker 内部 DNS 会解析
        # 注意：构建镜像时 nginx -t 会因为解析不到这个名字而失败，
        # 所以我没在 Dockerfile 里加 nginx -t（见 03-踩坑笔记 第 6 条）
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;

        # 这两个超时给大一点，PHP 查库偶尔慢
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 30s;
    }

    # 记录响应时间，压测和排查用得上
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;
}
